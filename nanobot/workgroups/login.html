<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/favicon.ico?v=2"><title>登录 · nanobot 个人工作台</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#202b34;background:#f6f7f9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(100%,460px);background:white;padding:36px;border:1px solid #dde2e7;border-radius:12px}h1{font-size:26px;margin:12px 0}p{line-height:1.8;color:#687781;font-size:14px}.brand{font-size:12px;letter-spacing:2px;color:#214e66}.primary,button{font:inherit;display:block;width:100%;text-align:center;padding:12px;border-radius:6px;text-decoration:none;cursor:pointer}.primary{background:#214e66;color:white;margin:24px 0 10px}button{background:white;border:1px solid #ccd5db;color:#214e66;margin-top:14px}label{display:block;margin:18px 0 8px;font-size:14px}input{width:100%;font:inherit;padding:12px;border:1px solid #ccd5db;border-radius:6px}details{border-top:1px solid #dde2e7;margin-top:24px;padding-top:18px}summary{cursor:pointer;font-size:14px;color:#214e66}code{overflow-wrap:anywhere}#error{color:#a32d29}small{display:block;margin-top:24px;color:#687781;line-height:1.7}button:disabled{opacity:.5}
</style>
<main><img src="/app-icon.png?v=2" alt="工作台图标" width="80" height="80" style="display:block;margin-bottom:16px"><div class="brand">NANOBOT · PERSONAL</div><h1>进入你的个人工作台</h1><p>资料、群组和任务，都在这台电脑上。</p><a class="primary" href="nanobot-workgroups://open">打开桌面应用</a><p>已安装时，点击即可自动启动并登录。也可以双击桌面上的“nanobot 个人工作台”。</p>
<details><summary>在当前浏览器登录</summary><form id="login"><label for="token">本机访问码</label><input type="password" id="token" autocomplete="off" required maxlength="200" placeholder="输入这台电脑的访问码"><button id="submit" type="submit">登录工作台</button></form><p>访问码保存在安装目录的 <code>personal-data/workgroups/dashboard.token</code>。桌面应用会自动读取，无需手动输入。</p></details><p id="error" role="alert"></p><small>本机登录与模型账号登录是两件事。模型调用使用已连接的 Codex / OpenCode 账号。</small></main>
<script>
document.getElementById('login').onsubmit=async event=>{event.preventDefault();const button=document.getElementById('submit'),error=document.getElementById('error');button.disabled=true;error.textContent='';try{const response=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:document.getElementById('token').value,next:location.pathname==='/'?'/':'/assistant'})});const body=await response.json();if(!response.ok)throw Error(body.error||'登录失败');location.replace(body.next)}catch(e){error.textContent=e.message}finally{button.disabled=false}};
</script></html>
