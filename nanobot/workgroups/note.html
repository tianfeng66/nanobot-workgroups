<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.ico?v=2"><title>$title · 整理笔记</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#202b34;background:#f6f7f9}*{box-sizing:border-box}body{margin:0}header{background:white;padding:18px 28px;border-bottom:1px solid #dde2e7}header a{display:inline-flex;align-items:center;gap:10px;text-decoration:none}main{max-width:880px;margin:32px auto;padding:40px 48px;background:white;border:1px solid #dde2e7}h1{font-size:30px;line-height:1.4;margin:12px 0 18px}h2{font-size:21px;margin:32px 0 14px;padding-top:20px;border-top:1px solid #e6ebef}h3{font-size:18px}a{color:#214e66}p,li{font-size:16px;line-height:1.9}li{margin:8px 0}ul,ol{padding-left:24px}.meta{color:#687781;font-size:13px;line-height:1.8}.actions{display:flex;gap:16px;flex-wrap:wrap;margin:22px 0 30px}.download{padding:10px 16px;background:#214e66;color:white;text-decoration:none;border-radius:6px}.body{overflow-wrap:anywhere}.body>p:first-child{padding-left:16px;border-left:3px solid #e8a133;font-size:18px}table{border-collapse:collapse;width:100%;font-size:14px;margin:18px 0}th,td{text-align:left;vertical-align:top;border:1px solid #d9e0e6;padding:10px;line-height:1.7}th{background:#f3f6f8}pre{white-space:pre-wrap}blockquote{margin:18px 0;padding-left:18px;border-left:3px solid #ccd5db}footer{margin-top:36px;padding-top:20px;border-top:1px solid #dde2e7}@media(max-width:650px){header{padding:16px}main{margin:0;padding:24px 18px;border:0}h1{font-size:25px}table{display:block;overflow-x:auto}p,li{font-size:15px}}
</style>
<header><a href="/assistant"><img src="/app-icon.png?v=2" alt="" width="32" height="32">返回资料工作台</a></header>
<main><div class="meta">整理笔记 · $category</div><h1>$title</h1><div class="meta">$tags</div>
<div class="actions"><a class="download" href="/api/assistant/note?id=$document_id">下载整理笔记（Markdown）</a><a href="/api/assistant/source?id=$document_id">下载原始资料</a></div>
<article class="body">$body</article>
<footer class="meta">来源：$source<br>依据导入资料整理，未作外部核验。页码对应原始 PDF；“建议”或“推导”属于整理者分析。</footer></main></html>
