<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/favicon.ico?v=2"><title>执行详情 · nanobot</title>
<style>body{font:15px/1.8 system-ui,"Microsoft YaHei",sans-serif;background:#f6f7f9;color:#202b34;max-width:1000px;margin:auto;padding:28px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}a{color:#214e66}button,select{font:inherit;padding:8px 14px;background:white;border:1px solid #ccd5db;border-radius:6px}#error{color:#a32d29}section{border-top:1px solid #d9e0e6;margin-top:20px}</style>
<a href="/assistant">← 返回个人工作台</a><h1>执行详情</h1><p id="status"></p><p id="error"></p><section><h2>任务要求</h2><pre id="prompt"></pre></section><section><h2>执行结果</h2><pre id="result"></pre></section><section><h2>日志</h2><select id="log" aria-label="日志类型"><option value="stderr.log">错误日志</option><option value="events.jsonl">执行事件</option><option value="result.md">原始结果</option></select><button id="read">读取日志末尾</button><pre id="output"></pre></section>
<script>const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('id');async function api(path){const r=await fetch(path),v=await r.json();if(!r.ok)throw Error(v.error);return v}async function refresh(){try{const t=await api('/api/task?id='+encodeURIComponent(id));$('status').textContent=t.backend+' · '+t.status;$('prompt').textContent=t.prompt;$('result').textContent=t.result;$('error').textContent=t.error}catch(e){$('error').textContent=e.message}finally{setTimeout(refresh,2500)}}$('read').onclick=async()=>{try{$('output').textContent=(await api('/api/task-log?id='+encodeURIComponent(id)+'&file='+encodeURIComponent($('log').value))).text||'暂无日志'}catch(e){$('error').textContent=e.message}};refresh();</script></html>
